# Every push and pull request: typecheck, tests (against a throwaway Postgres) and a production build.
name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: gsmlite_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ci" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/gsmlite_test
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/gsmlite_test
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/gsmlite_test
      BETTER_AUTH_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx next build

  # Optional: deploy to the server after CI passes on main. Needs repository secrets
  # DEPLOY_HOST, DEPLOY_USER and DEPLOY_SSH_KEY (see docs/DEPLOY-VPS.md). Skipped while they are missing.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then echo "No deploy secrets: skipping"; exit 0; fi
          mkdir -p ~/.ssh && echo "$KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh -i ~/.ssh/id -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            'cd ~/gsmlite && git pull --ff-only && cd deploy && docker compose up -d --build && docker image prune -f'
